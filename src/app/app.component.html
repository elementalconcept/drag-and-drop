<drag-and-drop (fileDropped)="onFileUpload($event)">
  <h4>Drag and drop one file at the time here</h4>
  <h4>or</h4>
  <h4>Click to browse for search your file</h4>
</drag-and-drop>

@if (files.length > 0) {
  <div class="files-list">
    <h4>List of file names</h4>
    @for (fileName of files; track fileName) {
      <div class="file">{{  fileName }}</div>
    }
  </div>
}
